name: Deploy Permanent Free Proxy

on:
  workflow_dispatch: # يتيح لك تشغيل السيرفر يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        sudo apt-get update && sudo apt-get install -y jq

    - name: Install Ngrok
      run: |
        curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.dir/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok

    - name: Start Proxy & Ngrok Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # تشغيل سكريبت v2ray2proxy في الخلفية على بورت 8080
        python -m v2ray2proxy --port 8080 &
        
        # ربط وتفعيل حساب نجروك
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        
        # فتح النفق العام وإظهار الرابط لك
        ngrok http 8080 --log=stdout
