name: Deploy Permanent Free Proxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Ngrok + Proxy
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # تثبيت نجروك
        sudo snap install ngrok
        
        # إنشاء مجلد الإعدادات يدوياً وإعطائه كامل الصلاحيات لتجنب خطأ الإذن
        mkdir -p /home/runner/.config/ngrok
        chmod 777 /home/runner/.config/ngrok
        
        # تشغيل سكريبت v2ray2proxy بالصيغة الصحيحة في الخلفية
        python -m v2ray2proxy &
        
        # تفعيل حساب نجروك مع تحديد مسار ملف الإعدادات المفتوح الصلاحيات
        ngrok config add-authtoken $NGROK_AUTH_TOKEN --config /home/runner/.config/ngrok/ngrok.yml
        
        # تشغيل النفق على المنفذ الافتراضي للسكربت (غالباً 8080 أو المنفذ المحلي)
        ngrok http 8080 --config /home/runner/.config/ngrok/ngrok.yml --log=stdout
