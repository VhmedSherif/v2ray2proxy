name: Deploy Permanent Free Proxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Ngrok + Proxy
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # تثبيت ngrok الرسمي عبر أداة snap المدمجة بالنظام
        sudo snap install ngrok
        
        # تشغيل سكريبت v2ray2proxy في الخلفية
        python -m v2ray2proxy --port 8080 &
        
        # تفعيل الحساب وتشغيل النفق
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        ngrok http 8080 --log=stdout
