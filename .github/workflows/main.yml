name: Deploy Permanent Free Proxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Run Ngrok + Proxy
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        V2RAY_LINK: ${{ secrets.V2RAY_LINK }}
      run: |
        # تثبيت ngrok مباشرة كـ binary لتجنب حظر صلاحيات snap
        curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar xvz -C /usr/local/bin

        # تشغيل v2ray2proxy في الخلفية مع تحديد البورت والرابط
        python -m v2ray2proxy "$V2RAY_LINK" --http-port 8080 &

        # انتظار ثواني للتأكد من قيام البروكسي المحلي
        sleep 3

        # تشغيل النفق مباشرة (يلتقط NGROK_AUTHTOKEN تلقائياً من الـ env)
        ngrok http 8080 --log=stdout
